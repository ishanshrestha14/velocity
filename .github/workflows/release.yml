# Builds, packages, Sparkle-signs, and publishes a Velocity release.
#
# Triggered by pushing a version tag (v0.2.0, etc.) — see README.md §42 for
# the full pipeline this implements, the versioning rule (bump
# CURRENT_PROJECT_VERSION every release; MARKETING_VERSION should match the
# tag), and "The free-path tradeoff": Velocity ships ad-hoc signed, with no
# Developer ID or notarization, by deliberate choice — not because this
# step is unfinished. That means installers and updates need one manual
# Gatekeeper "Open Anyway" click; see §42 before deciding to add signing
# back.
#
# Requires one repository secret, which does not exist yet:
#   SPARKLE_PRIVATE_KEY   (exported via generate_keys -x — README.md §42)
#
# Until it's added, this workflow fails at the Sparkle-signing step by
# design — an unsigned update archive must never reach a real appcast.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # publishing the release and committing appcast.xml back to main

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need main's history too, to commit appcast.xml back to it later

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve Swift package dependencies
        run: xcodebuild -resolvePackageDependencies -project Velocity.xcodeproj -scheme Velocity

      - name: Run tests
        run: xcodebuild test -project Velocity.xcodeproj -scheme Velocity -destination 'platform=macOS'

      - name: Build Release configuration
        run: |
          xcodebuild -project Velocity.xcodeproj -scheme Velocity -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build \
            clean build

      - name: Create DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP_PATH="build/Build/Products/Release/Velocity.app"
          STAGING="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$STAGING"
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "Velocity" -srcfolder "$STAGING" -ov -format UDZO \
            "Velocity-$VERSION.dmg"

      - name: Sign the DMG and regenerate appcast.xml
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          GENERATE_APPCAST=$(find build/SourcePackages/artifacts/sparkle -name generate_appcast -perm +111 | head -1)

          # generate_appcast reads every archive in this directory plus any
          # existing appcast.xml already in it, signs new ones, and folds
          # them into one updated feed — this is what actually produces the
          # sparkle:edSignature entry, not a hand-written XML fragment.
          ARCHIVES="$RUNNER_TEMP/release-archives"
          mkdir -p "$ARCHIVES"
          cp "Velocity-$VERSION.dmg" "$ARCHIVES/"
          cp appcast.xml "$ARCHIVES/"

          echo "$SPARKLE_PRIVATE_KEY" | "$GENERATE_APPCAST" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/" \
            --link "https://github.com/${{ github.repository }}" \
            "$ARCHIVES"

          cp "$ARCHIVES/appcast.xml" appcast.xml

      - name: Commit updated appcast.xml to main
        run: |
          # Save the freshly generated file before switching branches —
          # `git checkout` of another branch would otherwise overwrite this
          # tracked file with main's old copy of it.
          cp appcast.xml "$RUNNER_TEMP/new-appcast.xml"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/new-appcast.xml" appcast.xml
          git add appcast.xml
          git commit -m "chore(release): update appcast.xml for $GITHUB_REF_NAME" || echo "Nothing to commit"
          git push origin main

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "Velocity-$VERSION.dmg" \
            --title "Velocity $VERSION" \
            --notes "Ad-hoc signed, not notarized — after updating, macOS may require System Settings > Privacy & Security > Open Anyway once. See README.md §42." \
            --generate-notes
