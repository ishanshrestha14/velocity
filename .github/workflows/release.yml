# Builds, signs, notarizes, packages, and publishes a Velocity release.
#
# Triggered by pushing a version tag (v0.2.0, etc.) — see README.md §42 for
# the full pipeline this implements and the versioning rule (bump
# CURRENT_PROJECT_VERSION every release; MARKETING_VERSION should match the
# tag).
#
# Requires these repository secrets, none of which exist yet:
#   APPLE_DEVELOPER_ID_CERTIFICATE_P12       (base64-encoded .p12)
#   APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD
#   APPLE_TEAM_ID
#   APPLE_NOTARIZATION_APPLE_ID
#   APPLE_NOTARIZATION_APP_PASSWORD
#   SPARKLE_PRIVATE_KEY                      (exported via generate_keys -x)
#
# Until those secrets are added, this workflow will fail at the signing
# step by design — a Debug/ad-hoc build must never be published as a
# release users install.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve Swift package dependencies
        run: xcodebuild -resolvePackageDependencies -project Velocity.xcodeproj -scheme Velocity

      - name: Run tests
        run: xcodebuild test -project Velocity.xcodeproj -scheme Velocity -destination 'platform=macOS'

      - name: Import Developer ID signing certificate
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          CERTIFICATE_PATH="$RUNNER_TEMP/developer_id.p12"

          echo "$APPLE_DEVELOPER_ID_CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Build Release configuration
        run: |
          xcodebuild -project Velocity.xcodeproj -scheme Velocity -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            clean build

      - name: Notarize
        env:
          APPLE_NOTARIZATION_APPLE_ID: ${{ secrets.APPLE_NOTARIZATION_APPLE_ID }}
          APPLE_NOTARIZATION_APP_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="build/Build/Products/Release/Velocity.app"
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/Velocity.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Velocity.zip" \
            --apple-id "$APPLE_NOTARIZATION_APPLE_ID" \
            --password "$APPLE_NOTARIZATION_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"

      - name: Create DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP_PATH="build/Build/Products/Release/Velocity.app"
          STAGING="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$STAGING"
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "Velocity" -srcfolder "$STAGING" -ov -format UDZO \
            "Velocity-$VERSION.dmg"

      - name: Sparkle-sign the DMG
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SPARKLE_BIN=$(find build/SourcePackages/artifacts/sparkle -name sign_update -perm +111 | head -1)
          echo "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_private_key"
          "$SPARKLE_BIN" -f "$RUNNER_TEMP/sparkle_private_key" "Velocity-$VERSION.dmg" \
            > "$RUNNER_TEMP/sparkle_signature.txt"
          rm -f "$RUNNER_TEMP/sparkle_private_key"

      - name: Update appcast.xml
        run: |
          echo "TODO: append an <item> to appcast.xml using the signature" \
               "from $RUNNER_TEMP/sparkle_signature.txt, the tag version," \
               "and this release's DMG download URL, then commit it to main."
          echo "See README.md §42 for the entry's exact shape."

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "Velocity-$VERSION.dmg" \
            --title "Velocity $VERSION" \
            --generate-notes
